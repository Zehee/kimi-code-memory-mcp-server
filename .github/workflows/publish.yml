name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Verify version consistency
        # package.json, package-lock.json and src/version.ts must agree.
        run: node scripts/release.mjs --check-versions

      - name: Run the release gates
        # Runs the clean tree check, the package.json / package-lock.json /
        # src/version.ts consistency check, typecheck, lint, unit tests,
        # integration tests, the build, the dashboard security tests, the
        # built-instance stdio MCP verification and `npm pack --dry-run`.
        run: node scripts/release.mjs --verify --skip-install

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
